; Este archivo es solo un ejemplo. El vigilante crea su propio config.ini
; la primera vez que lo arrancas, con un canal nuevo ya generado.
; Si quieres cambiar algo, edita el config.ini que se creó al lado.

[alertas]

; Canal privado. Lo genera el vigilante solo; es el que pegas en la app.
; Quien lo conozca puede ver tus avisos, así que no lo publiques.
canal =

; Ruta del registro. Entre comillas no hace falta.
excel = C:\top secret\SELECTOR 3F\omega\outputs\registro_partidos.xlsx

; Servidor de avisos. ntfy.sh es gratis y no pide cuenta.
servidor = https://ntfy.sh

; Cuántos minutos antes del inicio quieres el aviso.
minutos_antes = 15

; Cada cuánto revisa el Excel.
revisar_cada_segundos = 30

; Prioridad de cada tipo de aviso:
;   5 o 4 = alarma a pantalla completa, suena y tapa lo que estés usando
;   3     = notificación normal, sin alarma
;   2     = notificación silenciosa
prioridad_previo = 5
prioridad_resultado = 4

; Avisar el marcador final cuando aparezca en las columnas GL/GV.
avisar_resultado = si

; Cuántos días hacia atrás sigue esperando resultados (por si los cargas tarde).
dias_atras_resultados = 3

; Para recibir solo algunas ligas, escríbelas separadas por comas.
; Vacío = todos los partidos del día. Ejemplo:
;   solo_competiciones = Prim B Nacional, Liga Profesional, Liga Pro Serie B
solo_competiciones =

; Recordatorio de los partidos que ya terminaron y siguen sin resultado cargado.
; 0 = apagado. 3 = un recordatorio silencioso cada 3 horas como mucho.
recordar_pendientes_cada_horas = 0

; ---------------------------------------------------------------- v2 (19/10/2026)

; Avisos en vivo (con la extensión Scarlet 3.4). 4 = alarma, 3 = notificación normal.
avisar_goles = si
prioridad_gol = 4
avisar_rojas = si
prioridad_roja = 4
; Avisar cuando el VAR anula un gol o una roja.
avisar_anulados = si

; Conexión DIRECTA con la app: el celular lee los partidos, las estadísticas y las
; alarmas de esta PC, sin pasar por ntfy (que gratis permite ~250 mensajes al día).
; En casa entra por el wifi; fuera, por un túnel gratis de Cloudflare (sin cuenta).
enlace_directo = si
puerto_app = 8782
; cloudflared · localhost.run · ninguno (ninguno = solo wifi de la casa)
tunel = cloudflared

; El resumen por ntfy es solo de respaldo (cuando la app no llega a la PC).
mandar_estado_cada_minutos = 15
; Tope de mensajes de ntfy al día para lo que NO es alarma.
limite_ntfy_dia = 230

; Cuántos partidos en juego sigue la extensión a la vez (una pestaña cada uno,
; en una ventana aparte y minimizada).
max_pestanas = 8
